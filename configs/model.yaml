# Model architecture configurations for H-CBM-EEG

encoder:
  name: "EEGPT"
  pretrained_weights: "checkpoints/EEGPT/checkpoint/eegpt_mcae_58chs_4s_large4E.ckpt"
  embedding_dim: 2048   # 4 summary tokens x 512, mean-pooled over 16 time patches (docs/EEGPT_REQUIREMENTS.md)
  freeze: true

hierarchical_cbm:
  level_1:
    description: "Neurophysiological concepts (theta, alpha, gamma band power + FAA)"
    output_dim: 37  # 12 channels * 3 bands + 1 FAA = 37
    hidden_dims: [256, 128]
  level_2:
    description: "Affective dimensions (Valence, Arousal, Dominance: real DENS self-ratings)"
    output_dim: 3
    hidden_dims: [64, 32]
  level_3:
    description: "Appraisal dimensions (Novelty, Goal conduciveness, Coping)"
    output_dim: 3
    hidden_dims: [32, 16]
  emotion_classifier:
    description: "Final 6-class emotion projection"
    num_classes: 6
    classes: ["happy", "surprise", "fear", "disgust", "anger", "sadness"]  # rev 3, see emotion_taxonomy.yaml (no neutral in DENS epochs)

baseline_flat_mlp:
  description: "Flat 2-layer MLP + GELU directly mapping EEGPT embedding to emotion class"
  hidden_dim: 128
  activation: "GELU"
  dropout: 0.1
  num_classes: 6

explain:
  qwen_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  quantization: "4bit"
  max_tokens: 256              # rev 3: 128 (and 192) cut explanations mid-sentence

# ---- Phase 5 training (FACED only; tuned on FACED validation folds, never on DEAP/DREAMER) ----
training:
  n_classes: 6
  lr: 1.0e-3
  weight_decay: 1.0e-4
  dropout: 0.1
  batch_size: 64               # rev 3 (D24): DENS has ~1,200 training windows; 256 gave only 5 updates per epoch
  max_epochs: 200
  min_epochs: 30               # D24: warm-up; no checkpoint selection or early stopping before it
  patience: 20                 # early stopping on validation macro-F1 (after warm-up)
  dominance_weight: 1.0        # rev 3: DENS dominance is a real rating (D3 pseudo-label applied to FACED only)
  loss_weights: {l1: 1.0, l2: 1.0, l3: 1.0, emotion: 1.0}
  escalation_coverage: 0.80    # threshold keeps 80% of validation windows; the rest are escalated
  max_temperature: 10.0        # D25: temperature clipped to [0.1, 10]
  search:                      # small documented grid (scripts/train.py --search), chosen by mean 5-fold val macro-F1
    lr: [1.0e-3, 3.0e-4]
    dropout: [0.1, 0.3]
