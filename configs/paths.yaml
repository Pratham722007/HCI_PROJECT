# Standardized relative paths for H-CBM-EEG

raw:
  faced: "data/raw/faced"            # symlinks -> datasets/FACED/*.pkl
  faced_meta: "datasets/FACED/METADATA"
  faced_ratings: "datasets/FACED/Code/Validation/Classification_validation/Svm_analysis/After_remarks"
  deap: "datasets/deap"
  dreamer: "datasets/DREAMER.mat"
  dens: "datasets/dens"                # OpenNeuro ds003751 v1.0.6 raw (30/40 .fdt truncated; not used in rev 3)
  dens_epochs: "datasets/dens_old/Physiological Data/PreProcessed-Emotion (Group-wise)/EEG_Data"   # rev 3 training data
  dens_beh: "datasets/dens_old/Physiological Data/Raw Data/Behavioural Data"                        # ratings, all 40 subjects

processed:
  root: "data/processed"
  faced_h5: "data/processed/faced.h5"
  deap_h5: "data/processed/deap.h5"
  dreamer_h5: "data/processed/dreamer.h5"

embeddings:
  root: "data/embeddings"
  faced_emb: "data/embeddings/faced_eegpt.h5"
  deap_emb: "data/embeddings/deap_eegpt.h5"
  dreamer_emb: "data/embeddings/dreamer_eegpt.h5"

artifacts:
  checkpoints: "checkpoints"
  reports: "reports"

eegpt:
  repo: "third_party/EEGPT"            # clone of github.com/BINE022/EEGPT (Apache-2.0), pinned commit in docs/EEGPT_REQUIREMENTS.md
  checkpoint: "checkpoints/EEGPT/checkpoint/eegpt_mcae_58chs_4s_large4E.ckpt"
